<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belriguardo Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #faf8f5;
            color: #2c2a29;
            font-family: "Plus Jakarta Sans", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        svg {
            color: #b05334;
            margin-bottom: 2rem;
            width: 120px;
            height: 120px;
        }
        h1 {
            font-family: "Playfair Display", serif;
            font-size: 2.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            font-family: "Playfair Display", serif;
            font-style: italic;
            font-size: 1.25rem;
            color: #615e5c;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
        }
        .badge {
            display: inline-block;
            background-color: #e6dfd5;
            color: #b05334;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
        }
        p.desc {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.6;
            color: #615e5c;
            margin-bottom: 2rem;
        }
        .footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            color: #a8a4a1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        a {
            color: #b05334;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Exact Octagon Logo from Belriguardo Foundation Pitch Deck -->
        <svg viewBox="0 0 200 200">
            <polygon points="130.6,26.1 69.4,26.1 26.1,69.4 26.1,130.6 69.4,173.9 130.6,173.9 173.9,130.6 173.9,69.4" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
            <polygon points="121.0,49.2 79.0,49.2 49.2,79.0 49.2,121.0 79.0,150.8 121.0,150.8 150.8,121.0 150.8,79.0" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
            <line x1="130.6" y1="26.1" x2="121.0" y2="49.2" stroke="currentColor" stroke-width="5" />
            <line x1="69.4" y1="26.1" x2="79.0" y2="49.2" stroke="currentColor" stroke-width="5" />
            <line x1="26.1" y1="69.4" x2="49.2" y2="79.0" stroke="currentColor" stroke-width="5" />
            <line x1="26.1" y1="130.6" x2="49.2" y2="121.0" stroke="currentColor" stroke-width="5" />
            <line x1="69.4" y1="173.9" x2="79.0" y2="150.8" stroke="currentColor" stroke-width="5" />
            <line x1="130.6" y1="173.9" x2="121.0" y2="150.8" stroke="currentColor" stroke-width="5" />
            <line x1="173.9" y1="130.6" x2="150.8" y2="121.0" stroke="currentColor" stroke-width="5" />
            <line x1="173.9" y1="69.4" x2="150.8" y2="79.0" stroke="currentColor" stroke-width="5" />
        </svg>

        <div class="badge">Coming Soon</div>
        <h1>Belriguardo Foundation</h1>
        <p class="subtitle">heritage as horizon</p>
        
        <p class="desc">We are preparing a new digital home for the restoration project of Chiesina del Belriguardo, an architectural jewel located in the heart of Southern Tuscany.</p>
        
        <div class="footer">
            &copy; 2025 Belriguardo Foundation &bull; Contact: <a href="mailto:paologiannotti@gmail.com">paologiannotti@gmail.com</a>
        </div>
    </div>
</body>
</html>
